<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rise of the bots · Year 9 Cybersecurity</title>
  <meta name="description" content="Interactive lesson on malware and bots for Year 9 Cybersecurity: a ransomware simulation, viruses, worms, ransomware and the WannaCry attack, trojans, spyware and keyloggers, adware, internet bots, botnets and DDoS attacks, and bots in the 2016 US election. A check after every section and an exit quiz. Progress is saved and can be copied.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="lesson.css">
  <link rel="stylesheet" href="scenes.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="logo" role="img" aria-label="British School Alzira · Xàtiva · Gandia"></span>
        <div class="titles">
          <p class="kicker">Year 9 · Cybersecurity · Lesson 4</p>
          <h1>Rise of the bots</h1>
        </div>
      </div>
      <div class="top-actions">
        <button class="chip-btn clock-btn" id="btnClock" aria-pressed="false" title="Lesson clock: click to start or pause, double-click to reset">⏱ <b>00:00</b> / 40</button>
        <button class="chip-btn prog-btn" id="btnProgress" title="See, copy and move your progress">📊 My progress <b id="progPct">0%</b></button>
        <button class="chip-btn" id="btnHelp" title="How to use this website" aria-label="How to use this website">? Help</button>
        <button class="chip-btn" id="btnProjector" aria-pressed="false" title="Bigger text for the classroom projector (P)">Projector mode</button>
        <button class="chip-btn" id="btnFull" title="Full screen (F)">Full screen</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Scenes"></nav>
  </header>

  <main>
    <section class="lab" id="lab">
      <div class="card stage-card">
        <div class="stage-head">
          <span class="scene-ic" id="sceneIc"></span>
          <h2 id="sceneTitle"></h2>
          <span class="mins" id="minBadge" hidden></span>
          <span class="try" id="tryBadge" hidden>Interactive · try it</span>
        </div>
        <div class="stage" id="stage"></div>
      </div>

      <aside class="side">
        <div class="card narration" id="narration" aria-live="polite">
          <p class="step-count" id="stepCount"></p>
          <h3 id="stepTitle"></h3>
          <div class="step-text" id="stepText"></div>
          <p class="tip" id="stepTip" hidden></p>
        </div>
        <div class="card vocab" id="vocab" hidden>
          <h4>Key words</h4>
          <dl id="vocabList"></dl>
        </div>
      </aside>
    </section>

    <section class="page" id="page" hidden></section>
  </main>

  <footer class="controls" id="controls">
    <button class="btn ghost" id="btnReset" title="Restart this scene (R)">↺ <span>Restart</span></button>
    <button class="btn ghost" id="btnBack" title="Back (←)">◀ <span>Back</span></button>
    <button class="btn primary" id="btnPlay" title="Play / pause (Space)">▶ Play</button>
    <button class="btn ghost" id="btnNext" title="Next (→)"><span>Next</span> ▶</button>
    <label class="speed">Speed
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </label>
    <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>
  </footer>

  <script src="js/core.js"></script>
  <script src="js/check.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/test.js"></script>
  <script src="js/scenes/start.js"></script>
  <script src="js/scenes/hook.js"></script>
  <script src="js/scenes/malware.js"></script>
  <script src="js/scenes/virus.js"></script>
  <script src="js/scenes/worm.js"></script>
  <script src="js/scenes/ransomware.js"></script>
  <script src="js/scenes/trojan.js"></script>
  <script src="js/scenes/spyware.js"></script>
  <script src="js/scenes/adware.js"></script>
  <script src="js/scenes/which.js"></script>
  <script src="js/scenes/bots.js"></script>
  <script src="js/scenes/botnet.js"></script>
  <script src="js/scenes/election.js"></script>
  <script src="js/scenes/quiz.js"></script>
  <script src="js/scenes/terms.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
